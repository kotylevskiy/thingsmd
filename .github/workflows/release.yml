name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('manifest.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== version)
            throw new Error('The release tag must match the plugin manifest version.');
          JS
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css \
            --verify-tag --title "ThingsMD $GITHUB_REF_NAME" --generate-notes
